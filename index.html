    <!-- Bootstrap: siempre fresco (no-cache). Recupera chunks viejos tras deploy sin depender del bundle JS. -->
    <script>
      ;(function () {
        var N = 'mc:chunk-reload-n'
        var MAX = 3
        function reload() {
          var c = Number(sessionStorage.getItem(N) || '0')
          if (c >= MAX) return
          sessionStorage.setItem(N, String(c + 1))
          var u = new URL(location.href)
          u.searchParams.set('_mc', String(Date.now()))
          location.replace(u.toString())
        }
        function isChunkMsg(m) {
          m = (m || '').toLowerCase()
          return (
            m.indexOf('failed to fetch dynamically imported module') !== -1 ||
            m.indexOf('importing a module script failed') !== -1 ||
            m.indexOf('error loading dynamically imported module') !== -1 ||
            m.indexOf('failed to load module script') !== -1 ||
            m.indexOf("cannot read properties of undefined (reading 'default')") !== -1
          )
        }
        window.addEventListener('vite:preloadError', function (e) {
          e.preventDefault()
          reload()
        })
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target
            if (t && t.tagName === 'SCRIPT' && t.src && t.src.indexOf('/assets/') !== -1) reload()
          },
          true,
        )
        window.addEventListener('unhandledrejection', function (e) {
          var m = String((e.reason && e.reason.message) || e.reason || '')
          if (isChunkMsg(m)) {
            e.preventDefault()
            reload()
          }
        })
        window.addEventListener('load', function () {
          setTimeout(function () {
            sessionStorage.removeItem(N)
          }, 4000)
        })
      })()
    </script>
